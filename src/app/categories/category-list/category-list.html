<div class="bg-white rounded-xl shadow p-6">

  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-slate-800">Categories</h2>
    <button  routerLink="/admin/categories/create"
    class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-slate-900">
    + Add Category
    </button>
  </div>
  
  <!-- Empty State -->
  <p *ngIf="!loading && categories.length === 0" class="text-gray-500">
    No categories found
  </p>

  <table class="w-full text-sm">
    <thead>
      <tr class="text-left border-b">
        <th class="py-3">#</th>
        <th>Name</th>
        <th class="text-right">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let cat of categories; index as i"
          class="border-b hover:bg-slate-50">
        <td class="py-3">{{ i + 1 }}</td>
        <td>{{ cat.name }}</td>
        <td class="text-right space-x-2">
         <button
            class="text-blue-600 hover:underline"
            [routerLink]="['/admin/categories/edit', cat.id]">
            Edit
          </button>
          <button
            (click)="deleteCategory(cat.id!)"
            class="text-red-600 hover:underline">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
