<div class="flex min-h-screen bg-slate-100">

  <!-- Sidebar -->
  <aside class="w-72 bg-gradient-to-b from-slate-900 to-slate-800 text-slate-200 shadow-xl">
    <div class="px-6 py-6 border-b border-slate-700">
      <h1 class="text-2xl font-extrabold tracking-wide text-white">
        E-Commerce Admin
      </h1>
      <p class="text-xs text-slate-400 mt-1">Inventory Management</p>
    </div>

    <nav class="mt-6 space-y-1 px-3">

      <a
        routerLink="dashboard"
        routerLinkActive="bg-slate-700 text-white"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium hover:bg-slate-700 transition">
        📊 Dashboard
      </a>

      <a
        routerLink="categories"
        routerLinkActive="bg-slate-700 text-white"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium hover:bg-slate-700 transition">
        🗂 Categories
      </a>

      <a
        routerLink="products"
        routerLinkActive="bg-slate-700 text-white"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium hover:bg-slate-700 transition">
        📦 Products
      </a>

      <a
        routerLink="stock"
        routerLinkActive="bg-slate-700 text-white"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium hover:bg-slate-700 transition">
        📈 Stock
      </a>

    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
      <div>
        <h2 class="text-xl font-semibold text-slate-800">Admin Dashboard</h2>
        <p class="text-sm text-slate-500">Manage your store efficiently</p>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-right">
          <p class="text-sm font-medium text-slate-800">Admin</p>
          <p class="text-xs text-slate-500">admin@site.com</p>
        </div>

        <div class="h-9 w-9 rounded-full bg-slate-800 text-white flex items-center justify-center">
          A
        </div>

        <button (click)="logout()"
          class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600 transition">
          Logout
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="p-6 flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
