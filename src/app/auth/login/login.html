<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow w-96">
    <h2 class="text-2xl font-bold mb-4 text-center">Admin Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="space-y-4">
      <input
        type="email"
        placeholder="Email"
        formControlName="email"
        class="w-full border px-3 py-2 rounded"
      />

      <input
        type="password"
        placeholder="Password"
        formControlName="password"
        class="w-full border px-3 py-2 rounded"
      />

      <p class="text-red-500 text-sm" *ngIf="error">{{ error }}</p>

      <button
        type="submit"
        class="w-full bg-black text-white py-2 rounded hover:bg-gray-800"
      >
        Login
      </button>
    </form>
  </div>
</div>
