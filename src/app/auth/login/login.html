<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-black">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">

    <!-- Logo / Title -->
    <div class="text-center mb-6">
      <div class="mx-auto mb-3 h-12 w-12 rounded-full bg-black flex items-center justify-center">
        <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 11c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3z"/>
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M6 20v-1a6 6 0 0112 0v1"/>
        </svg>
      </div>

      <h2 class="text-2xl font-bold text-gray-900">Admin Panel</h2>
      <p class="text-sm text-gray-500">Sign in to manage your store</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="space-y-5">

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email address
        </label>
        <input
          type="email"
          formControlName="email"
          placeholder="admin@example.com"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-black focus:border-black"
        />
         <p
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
          class="text-sm text-red-600 mt-1"
        >
          <span *ngIf="loginForm.get('email')?.errors?.['required']">
            Email is required
          </span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">
            Please enter a valid email address
          </span>
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-black focus:border-black"
        />
          <p
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          class="text-sm text-red-600 mt-1"
        >
          <span *ngIf="loginForm.get('password')?.errors?.['required']">
            Password is required
          </span>
        </p>
      </div>

      <!-- Error Message -->
      <div *ngIf="error"
          class="text-red-600 text-sm text-center mt-2">
        {{ error }}
      </div>

      <!-- Button -->
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full rounded-lg bg-black py-2.5 text-white font-semibold
               hover:bg-gray-800 transition
               disabled:opacity-50 disabled:cursor-not-allowed">
        Sign In
      </button>
    </form>

    <!-- Footer -->
    <p class="mt-6 text-center text-xs text-gray-400">
      © 2026 Ecommerce Admin. All rights reserved.
    </p>
  </div>
</div>
